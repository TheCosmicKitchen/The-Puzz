<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}a.eyebrow{display:block;text-decoration:none}a.eyebrow:hover{color:var(--ink)}</style>
<title>Hanko</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: one column. Header + mode tabs, a round stepper, one round card at a time, then the result stamp sheet. Kanji are set in a textbook-style face; correct answers get a vermilion hanko stamp. */
:root{
  --bg:#E6EBEE; --surface:#F6F8F9; --ink:#1C2530; --muted:#5A6772; --felt:#D3DADF; --line:#A9B5BE;
  --ok:#2C7A4C; --bad:#C2372A; --shu:#C8372D; --shu-soft:rgba(200,55,45,.12); --paper:#FBF8F2; --gold:#C98A12;
  --display:"Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121820; --surface:#1A222B; --ink:#E4EAEE; --muted:#93A1AC; --felt:#26323C; --line:#3B4954;
  --ok:#62C38A; --bad:#FF6D5C; --shu:#E5584C; --shu-soft:rgba(229,88,76,.16); --paper:#20262E; --gold:#E3A93A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1A222B; --ink:#E4EAEE; --muted:#93A1AC; --felt:#26323C; --line:#3B4954;
  --ok:#62C38A; --bad:#FF6D5C; --shu:#E5584C; --shu-soft:rgba(229,88,76,.16); --paper:#20262E; --gold:#E3A93A; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 .seal{flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--kanji);font-size:22px;line-height:1;color:var(--surface);background:var(--shu);border-radius:8px;transform:rotate(-6deg)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;background:var(--felt);border-radius:999px;padding:3px}
.tabs button{font:600 14px var(--display);border:0;background:none;color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--display);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.small{font-size:12px;padding:4px 10px}
.btn:disabled{opacity:.4;cursor:default}
.chip{font:600 13px var(--display);border:1.5px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--shu);color:var(--shu);background:var(--shu-soft)}
:focus-visible{outline:2.5px solid var(--shu);outline-offset:2px}
.steps{display:flex;gap:6px}
.step{flex:1;display:flex;flex-direction:column;gap:4px;font:600 12px var(--display);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.step i{display:block;height:6px;border-radius:3px;background:var(--felt)}
.step.on{color:var(--ink)}.step.on i{background:var(--ink)}
.step.done i{background:var(--shu)}
.card{background:var(--surface);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.prompt{font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clue{font:600 26px var(--display);line-height:1.15;text-wrap:balance}
.k{font-family:var(--kanji);font-weight:600}
/* build round */
.slots{display:flex;gap:10px;align-items:center;justify-content:center;min-height:86px;flex-wrap:wrap}
.slot{width:72px;height:80px;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--paper);cursor:pointer}
.plus{font:600 22px var(--display);color:var(--muted)}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:72px;min-height:80px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.tile:hover{border-color:var(--ink)}
.tile:disabled{opacity:.25;cursor:default}
.tile .g,.slot .g{font-family:var(--kanji);font-size:36px;line-height:1}
.tile .lb,.slot .lb{font-size:11px;color:var(--muted);line-height:1.15;max-width:66px;overflow-wrap:anywhere}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* reveal */
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.big{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;font-family:var(--kanji);font-size:96px;line-height:1;border-radius:16px;background:var(--paper);border:1.5px solid var(--felt)}
.stamp{position:absolute;right:-12px;top:-12px;width:46px;height:46px;border-radius:9px;border:3px solid var(--shu);color:var(--shu);font-family:var(--kanji);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);background:var(--surface);writing-mode:vertical-rl;opacity:.92}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thunk .32s cubic-bezier(.3,1.6,.6,1)}@keyframes thunk{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}}
.mean{font:600 22px var(--display)}
.reads{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:15px}
.reads span b{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.recipe{font-size:15px;color:var(--muted)}
.recipe .k{font-size:20px;color:var(--ink)}
.words{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font-size:14px;align-items:baseline}
.words .k{font-size:20px}
.words .kn{color:var(--muted);font-size:12px}
/* hub */
.hub{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(5,52px);gap:6px;justify-content:center;align-items:center;justify-items:center;margin:4px 0}
.hk{width:56px;height:56px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);font-family:var(--kanji);font-size:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0}
.hk.ok{border-color:var(--ok);border-width:2.5px}
.hk.no{border-color:var(--bad);border-width:2.5px}
.hc{width:64px;height:64px;border-radius:14px;border:2.5px dashed var(--shu);background:var(--shu-soft);font-family:var(--kanji);font-size:40px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.hc.solved{border-style:solid;background:var(--paper)}
.arw{font:600 18px var(--display);color:var(--line)}
.wordlist{display:flex;flex-direction:column;gap:4px;width:100%;max-width:360px;text-align:left;font-size:14px}
.wordlist div{display:flex;gap:10px;align-items:baseline;padding:4px 8px;border-radius:8px;background:var(--bg)}
.wordlist .k{font-size:20px;min-width:2.4em}
.wordlist .kn{color:var(--muted);font-size:12px}
.wordlist .q{color:var(--muted)}
/* recall */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:360px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px;cursor:pointer;color:var(--ink);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.opt .g{font-family:var(--kanji);font-size:48px;line-height:1}
.opt .t{font:600 17px var(--display)}
.opt .sm{font-size:12px;color:var(--muted)}
.opt.right{border-color:var(--ok);border-width:2.5px}
.opt.wrong{border-color:var(--bad);border-width:2.5px;opacity:.75}
.opt:disabled{cursor:default}
.qbig{font-family:var(--kanji);font-size:88px;line-height:1}
.pips{display:flex;gap:6px;justify-content:center}
.pips i{width:12px;height:12px;border-radius:3px;background:var(--felt)}
.pips i.r{background:var(--shu)}.pips i.o{background:var(--gold)}.pips i.c{outline:2px solid var(--ink);outline-offset:1px}
.feedback{min-height:1.5em;font-size:14px;color:var(--muted)}
.feedback.bad{color:var(--bad)}.feedback.good{color:var(--ok)}
/* result */
.sheet{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--shu)}
.sheet h2{font:600 22px var(--display);margin:0}
.sheet pre{font-family:var(--body);margin:0;white-space:pre-wrap;background:var(--bg);padding:10px 12px;border-radius:10px;font-size:15px;line-height:1.45;user-select:all}
/* stamp book */
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;width:100%}
.bk{aspect-ratio:1;max-width:100%;border-radius:9px;border:1.5px dashed var(--felt);background:var(--bg);font-family:var(--kanji);font-size:26px;display:flex;align-items:center;justify-content:center;color:var(--line);cursor:pointer;padding:0}
.bk.met{border:1.5px solid var(--shu);color:var(--ink);background:var(--paper)}
.bk.due{box-shadow:inset 0 -4px 0 var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);justify-content:center}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.legend .l1::before{border:1.5px solid var(--shu);background:var(--paper)}.legend .l2::before{box-shadow:inset 0 -3px 0 var(--gold);border:1.5px solid var(--shu)}.legend .l3::before{border:1.5px dashed var(--felt)}
.detail{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.proto{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.proto select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.foot{text-align:center;color:var(--muted);font-size:12px;max-width:62ch;margin:0 auto}
@media (max-width:400px){.tile,.slot{width:64px}.hub{grid-template-columns:repeat(3,58px)}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="eyebrow" href="./">← The Puzz</a>
      <h1>Hanko <span class="seal" aria-hidden="true">判</span></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tabs" role="group" aria-label="Mode">
      <button id="tToday" aria-pressed="true">Today</button>
      <button id="tPractice" aria-pressed="false">Practice</button>
      <button id="tBook" aria-pressed="false">Stamp book</button>
    </div>
  </header>
  <div class="bar">
    <div class="row" id="practiceCtl" hidden>
      <button class="chip" data-pr="build" aria-pressed="true">Build</button>
      <button class="chip" data-pr="hub" aria-pressed="false">Hub</button>
      <button class="chip" data-pr="recall" aria-pressed="false">Look-alikes</button>
      <select class="btn small" id="levelSel" aria-label="Kanji range"><option value="40">First 40</option><option value="80">First 80</option><option value="240" selected>Grades 1–2 (240)</option></select>
    </div>
    <div class="steps" id="steps" style="flex:1;min-width:220px"></div>
    <button class="chip" id="readBtn" aria-pressed="false" title="Show kana readings">あ Readings</button>
  </div>
  <main id="main"></main>
  <div class="proto" id="proto"><span>Prototype:</span><label>preview day <select id="daySel"></select></label><button class="btn small" id="resetBtn">Reset my stamp book</button></div>
  <div class="foot">Kanji and word data from KANJIDIC2 and JMdict (Electronic Dictionary Research and Development Group, CC BY-SA 4.0); kanji parts from KanjiVG (CC BY-SA 3.0).</div>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function hseed(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffle=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const {order:ORDER,K,P:PARTS,W}=DATA;
const SET=new Set(ORDER);
const WORD=new Map(W.map(w=>[w[0],w]));
const NUM=new Set('一二三四五六七八九十百千');
// one short keyword per kanji: the first single-word meaning, else the first meaning
const kw=c=>K[c]?(K[c].kw||K[c].m[0]):(PARTS[c]||'?');
const reads=c=>{const k=K[c];return k?{on:k.on||[],kun:k.kun||[]}:{on:[],kun:[]}};

// ---- day + personal deck ----
const DAY0=new Date(2026,9,25);
const realDay=()=>{const d=new Date(),t=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((t-DAY0)/864e5)+1};
let day=realDay(),showReads=!!store.get('hanko-reads');
let deck=store.get('hanko-deck')||{};  // c -> {box, due, seen}
const saveDeck=()=>store.set('hanko-deck',deck);
const INTERVAL=[0,1,2,4,8,16];
function meet(c){if(!deck[c]){deck[c]={box:1,due:day+1,seen:1};saveDeck()}}
function review(c,good){const d=deck[c]||{box:1,due:day,seen:0};d.seen++;if(good){d.box=Math.min(5,d.box+1);d.due=day+INTERVAL[d.box]}else{d.box=1;d.due=day+1}deck[c]=d;saveDeck()}
const dueList=()=>Object.keys(deck).filter(c=>deck[c].due<=day).sort((a,b)=>deck[a].due-deck[b].due);
const known=()=>{const s=new Set(ORDER.slice(0,Math.max(1,Math.min(day,ORDER.length))));Object.keys(deck).forEach(c=>s.add(c));return [...s]};

// ---- puzzle builders ----
function buildRound(c,r){
  const k=K[c],parts=k.p;
  if(parts.length<2){ // a building block: meet it, then pick its meaning
    const others=shuffle(ORDER.filter(o=>o!==c&&K[o].p.length<2&&kw(o)!==kw(c)),r).slice(0,3);
    return {type:'meet',c,opts:shuffle([c,...others],r)}}
  const pool=new Set();(k.la||[]).forEach(o=>(K[o]&&K[o].p||[]).forEach(p=>pool.add(p)));
  shuffle(ORDER,r).slice(0,30).forEach(o=>K[o].p.forEach(p=>pool.add(p)));
  parts.forEach(p=>pool.delete(p));
  const decoys=shuffle([...pool].filter(p=>PARTS[p]),r).slice(0,Math.max(3,6-parts.length));
  return {type:'build',c,parts,tray:shuffle([...parts,...decoys],r)}}
function hubFor(c,r,poolSet){
  const pre=W.filter(w=>w[0][1]===c&&w[0][0]!==c).map(w=>w[0][0]),post=W.filter(w=>w[0][0]===c&&w[0][1]!==c).map(w=>w[0][1]);
  const pref=(arr)=>{const a=shuffle(arr,r);return [...a.filter(x=>!NUM.has(x)&&poolSet.has(x)),...a.filter(x=>!NUM.has(x)&&!poolSet.has(x)),...a.filter(x=>NUM.has(x))]};
  const A=pref(pre),B=pref(post);
  for(let tries=0;tries<30;tries++){
    const a=shuffle(A.slice(0,5),r).slice(0,2),b=shuffle(B.filter(x=>!a.includes(x)).slice(0,5),r).slice(0,2);
    if(a.length<2||b.length<2||a.filter(x=>NUM.has(x)).length+b.filter(x=>NUM.has(x)).length>1)continue;
    const words=[a[0]+c,a[1]+c,c+b[0],c+b[1]];
    const fits=d=>words.filter(w=>WORD.has(w.replace(c,'#').replace('#',d))).length;
    // the centre must be the only kanji that makes all four words
    const rivals=ORDER.filter(d=>d!==c&&WORD.has(a[0]+d)&&WORD.has(a[1]+d)&&WORD.has(d+b[0])&&WORD.has(d+b[1]));
    if(rivals.length)continue;
    const traps=shuffle(ORDER.filter(d=>d!==c&&![...a,...b].includes(d)&&(WORD.has(a[0]+d)+WORD.has(a[1]+d)+WORD.has(d+b[0])+WORD.has(d+b[1]))>=2),r).slice(0,2);
    const looks=shuffle((K[c].la||[]).filter(d=>SET.has(d)&&!traps.includes(d)&&![...a,...b].includes(d)),r).slice(0,2);
    const fill=shuffle([...poolSet].filter(d=>d!==c&&!traps.includes(d)&&!looks.includes(d)&&![...a,...b].includes(d)),r);
    const tray=shuffle([c,...traps,...looks,...fill].slice(0,6),r);
    return {type:'hub',c,top:a[0],left:a[1],right:b[0],bottom:b[1],words,tray}}
  return null}
function hubAround(seed,cands,poolSet,first,keepOrder){const r=mulberry(hseed(seed));for(const c of [...(first?[first]:[]),...(keepOrder?cands:shuffle(cands,r))]){const h=hubFor(c,r,poolSet);if(h)return h}return null}
function recallQ(c,r,dir){
  const kwc=kw(c);let others=(K[c].la||[]).filter(o=>K[o]&&kw(o)!==kwc);
  if(others.length<3)others=[...others,...shuffle(ORDER.filter(o=>o!==c&&!others.includes(o)&&Math.abs(K[o].s-K[c].s)<=2),r)];
  const seenKw=new Set([kwc]);others=others.filter(o=>{const k=kw(o);if(seenKw.has(k))return false;seenKw.add(k);return true}).slice(0,3);
  return {type:'recall',c,dir,opts:shuffle([c,...others],r)}}

// ---- state ----
let mode='today',cur=null,practiceKind='build',T=null; // T = today's run
function todaySeed(){return 'hanko-'+day}
function makeToday(){
  const r=mulberry(hseed(todaySeed())),c=ORDER[(day-1)%ORDER.length];
  const kn=new Set(ORDER.slice(0,Math.max(30,day)));
  // the hub centres on a kanji from the last few days (not the one you just built), else anything early
  const recentC=shuffle(ORDER.slice(Math.max(0,day-8),day-1),r);
  const hub=hubAround(todaySeed()+'hub',[...recentC,...shuffle(ORDER.slice(0,Math.max(30,day)).filter(x=>x!==c),r).slice(0,40)].filter(x=>x!==c),kn,day>1?null:c,true);
  // recall: your due stamps first, then the kanji just before today
  const due=dueList().filter(x=>x!==c),recent=ORDER.slice(Math.max(0,day-12),day-1).reverse();
  const items=[...new Set([...due,...recent,...shuffle(ORDER.slice(0,Math.max(12,day)),r)])].filter(x=>x!==c).slice(0,5);
  return {day,c,rounds:[buildRound(c,r),hub,...items.map((x,i)=>recallQ(x,r,i%2?'k2m':'m2k'))].filter(Boolean),i:0,marks:[],hints:0}}
function loadToday(){
  const saved=store.get('hanko-today');
  T=saved&&saved.day===day?saved:makeToday();
  if(!T.rounds.length)T=makeToday();
  renderToday();
}
function saveToday(){if(day===realDay()||true)store.set('hanko-today',T)}

// ---- rendering ----
function setMode(m){mode=m;['Today','Practice','Book'].forEach(x=>$('t'+x).setAttribute('aria-pressed',m===x.toLowerCase()));
  $('practiceCtl').hidden=m!=='practice';$('steps').hidden=m!=='today';$('proto').hidden=m==='practice'}
function stepsFor(){const n=T.rounds.length,labels=T.rounds.map(r=>r.type==='build'||r.type==='meet'?'Build':r.type==='hub'?'Hub':'Recall');
  const groups=[['Build',0],['Hub',1],['Recall',2]];
  $('steps').innerHTML=groups.map(([g])=>{const idx=labels.map((l,i)=>l===g?i:-1).filter(i=>i>=0);if(!idx.length)return'';
    const done=idx.every(i=>i<T.i),on=idx.includes(T.i);return `<div class="step ${done?'done':''} ${on?'on':''}"><i></i>${g}${g==='Recall'?` ${Math.min(Math.max(0,T.i-idx[0]),idx.length)}/${idx.length}`:''}</div>`}).join('')}
function renderToday(){setMode('today');$('sub').textContent=`Day ${T.day} · today's kanji is number ${((T.day-1)%ORDER.length)+1} of ${ORDER.length}`;
  stepsFor();
  if(T.i>=T.rounds.length){renderSheet();return}
  cur=T.rounds[T.i];renderRound(cur,(good,hint)=>{T.marks[T.i]=good?(hint?'o':'r'):'o';T.i++;saveToday();renderToday()})}

function readsHTML(c){if(!showReads)return'';const r=reads(c);return `<div class="reads">${r.kun.length?`<span><b>kun</b>${esc(r.kun.join('、'))}</span>`:''}${r.on.length?`<span><b>on</b>${esc(r.on.join('、'))}</span>`:''}</div>`}
function wordsFor(c,n){return W.filter(w=>w[0].includes(c)).sort((a,b)=>(known().includes(a[0].replace(c,''))?0:1)-(known().includes(b[0].replace(c,''))?0:1)).slice(0,n)}
function revealHTML(c,extra=''){const k=K[c];
  const recipe=k.p.length>=2?`<div class="recipe">${k.p.map(p=>`<span class="k">${p}</span> ${esc(PARTS[p]||kw(p)||'')}`).join(' + ')} → <span class="k">${c}</span> ${esc(kw(c))}</div>`:'';
  const ws=wordsFor(c,4);
  return `<div class="reveal"><div class="big k">${c}<span class="stamp">済</span></div>
    <div class="mean">${esc(k.m.join(' · '))}</div>${readsHTML(c)}${recipe}
    ${ws.length?`<div class="words">${ws.map(w=>`<span class="k">${w[0]}</span><span>${esc(w[2])}${showReads?` <span class="kn">${esc(w[1])}</span>`:''}</span>`).join('')}</div>`:''}${extra}</div>`}

function renderRound(R,done){cur=R;
  const main=$('main');let tries=0,used=false;
  const finish=good=>{const btn=`<button class="btn primary" id="nextBtn">${mode==='today'?'Next':'Another'}</button>`;return btn};
  if(R.type==='build'){
    const pick=[];const draw=()=>{
      main.innerHTML=`<section class="card"><div class="prompt">Build today's kanji</div><div class="clue">“${esc(kw(R.c))}”</div>
      <div class="slots" id="slots">${R.parts.map((_,i)=>{const t=pick[i];return (i?'<span class="plus">+</span>':'')+(t!=null?`<button class="slot full" data-s="${i}" aria-label="Remove ${R.tray[t]}"><span class="g">${R.tray[t]}</span><span class="lb">${esc(PARTS[R.tray[t]]||'')}</span></button>`:`<div class="slot" aria-label="Empty slot"></div>`)}).join('')}</div>
      <div class="tray">${R.tray.map((p,i)=>`<button class="tile" data-t="${i}" ${pick.includes(i)?'disabled':''} aria-label="${p}, ${esc(PARTS[p]||'')}"><span class="g">${p}</span><span class="lb">${esc(PARTS[p]||'')}</span></button>`).join('')}</div>
      <div class="feedback" id="fb">Tap the parts that make this kanji.</div></section>`;
      main.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(pick.length>=R.parts.length)return;pick.push(+b.dataset.t);check()});
      main.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.s,1);draw()})};
    const check=()=>{draw();if(pick.length<R.parts.length)return;
      const a=pick.map(i=>R.tray[i]).sort().join(),b=R.parts.slice().sort().join();
      if(a===b){meet(R.c);main.innerHTML=`<section class="card"><div class="prompt">${tries?'Built, after '+tries+' tr'+(tries>1?'ies':'y'):'Built first time'}</div>${revealHTML(R.c)}${finish()}</section>`;$('nextBtn').onclick=()=>done(tries===0,false)}
      else{tries++;$('slots').classList.add('shake');$('fb').textContent='Those parts make something else. Tap a part to take it out.';$('fb').className='feedback bad'}};
    draw();return}
  if(R.type==='meet'){
    main.innerHTML=`<section class="card"><div class="prompt">A new building block</div><div class="qbig">${R.c}</div><div class="clue" style="font-size:18px">What does it mean?</div>
      <div class="opts">${R.opts.map(o=>`<button class="opt" data-o="${o}"><span class="t">${esc(kw(o))}</span></button>`).join('')}</div><div class="feedback" id="fb">It's one of the simple shapes other kanji are built from.</div></section>`;
    main.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(b.dataset.o===R.c){meet(R.c);main.innerHTML=`<section class="card"><div class="prompt">${tries?'Got it':'Got it first time'}</div>${revealHTML(R.c)}${finish()}</section>`;$('nextBtn').onclick=()=>done(tries===0,false)}
      else{tries++;b.classList.add('wrong');b.disabled=true;$('fb').textContent='Not that one. Look at its shape again.';$('fb').className='feedback bad'}});return}
  if(R.type==='hub'){
    let placed=null,showGloss=false;const draw=()=>{
      const st=d=>{if(!d)return{};const ok={top:WORD.has(R.top+d),left:WORD.has(R.left+d),right:WORD.has(d+R.right),bottom:WORD.has(d+R.bottom)};return ok};
      const ok=st(placed);const cls=k=>placed?(ok[k]?'ok':'no'):'';
      const solved=placed===R.c;
      const gl=w=>{const e=WORD.get(w);return e?e[2]:''};
      main.innerHTML=`<section class="card"><div class="prompt">Find the hub</div><div class="clue" style="font-size:18px">Which kanji goes in the middle to make four words?</div>
        <div class="hub">
          <span></span><button class="hk ${cls('top')}" data-k="${R.top}" aria-label="${R.top}">${R.top}</button><span></span>
          <span></span><span class="arw">↓</span><span></span>
          <button class="hk ${cls('left')}" data-k="${R.left}" aria-label="${R.left}">${R.left}</button><div class="hc ${solved?'solved':''}" aria-label="Centre">${placed||''}</div><button class="hk ${cls('right')}" data-k="${R.right}" aria-label="${R.right}">${R.right}</button>
          <span></span><span class="arw">↓</span><span></span>
          <span></span><button class="hk ${cls('bottom')}" data-k="${R.bottom}" aria-label="${R.bottom}">${R.bottom}</button><span></span>
        </div>
        ${solved?'':`<div class="tray">${R.tray.map(t=>`<button class="tile" data-c="${t}" ${placed===t?'disabled':''}><span class="g">${t}</span><span class="lb">${esc(kw(t))}</span></button>`).join('')}</div>`}
        <div class="feedback ${placed&&!solved?'bad':solved?'good':''}" id="fb">${solved?'Hub found.':placed?`${Object.values(ok).filter(Boolean).length} of 4 words work. Green ones are real words.`:'Words read left to right and top to bottom, through the middle.'}</div>
        ${solved||showGloss?`<div class="wordlist">${R.words.map(w=>`<div><span class="k">${solved?w:w.replace(R.c,'？')}</span><span>${esc(gl(w))}</span>${solved&&showReads?`<span class="kn">${esc(WORD.get(w)[1])}</span>`:''}</div>`).join('')}</div>`:''}
        ${solved?`<div class="recipe">The hub is <span class="k">${R.c}</span> ${esc(kw(R.c))}${showReads?' · '+esc(reads(R.c).on.concat(reads(R.c).kun).slice(0,3).join('、')):''}</div>`+finish():`<button class="btn small" id="glossBtn" ${showGloss?'disabled':''}>Show the four word meanings</button>`}
        <div class="feedback" style="font-size:12px">Tap a spoke kanji to see what it means.</div></section>`;
      main.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{placed=b.dataset.c;if(placed!==R.c){tries++;}else{review(R.c,tries===0&&!used);meet(R.c)}draw()});
      main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{$('fb').textContent=`${b.dataset.k}: ${kw(b.dataset.k)}${showReads?' · '+reads(b.dataset.k).kun.concat(reads(b.dataset.k).on).slice(0,2).join('、'):''}`;$('fb').className='feedback'});
      if($('glossBtn'))$('glossBtn').onclick=()=>{showGloss=true;used=true;draw()};
      if($('nextBtn'))$('nextBtn').onclick=()=>done(tries===0,used)};
    draw();return}
  if(R.type==='recall'){
    const m2k=R.dir==='m2k';
    main.innerHTML=`<section class="card"><div class="prompt">Which stamp?</div>${m2k?`<div class="clue">“${esc(kw(R.c))}”</div>`:`<div class="qbig">${R.c}</div><div class="clue" style="font-size:18px">means…</div>`}
      <div class="opts">${R.opts.map(o=>`<button class="opt" data-o="${o}">${m2k?`<span class="g">${o}</span>`:`<span class="t">${esc(kw(o))}</span>`}</button>`).join('')}</div><div class="feedback" id="fb">${deck[R.c]?'From your stamp book.':'One you met recently.'}</div></section>`;
    main.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
      if(b.dataset.o===R.c){review(R.c,tries===0);b.classList.add('right');b.insertAdjacentHTML('beforeend','<span class="stamp" style="right:-8px;top:-8px;width:34px;height:34px;font-size:12px">済</span>');
        main.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(x.dataset.o!==R.c&&m2k)x.insertAdjacentHTML('beforeend',`<span class="sm">${esc(kw(x.dataset.o))}</span>`)});
        $('fb').innerHTML=`<span class="k" style="font-size:20px">${R.c}</span> ${esc(K[R.c].m.join(' · '))}${showReads?' · '+esc(reads(R.c).kun.concat(reads(R.c).on).slice(0,3).join('、')):''}`;$('fb').className='feedback good';
        b.closest('.card').insertAdjacentHTML('beforeend',finish());$('nextBtn').onclick=()=>done(tries===0,false)}
      else{tries++;b.classList.add('wrong');b.disabled=true;if(m2k)b.insertAdjacentHTML('beforeend',`<span class="sm">${esc(kw(b.dataset.o))}</span>`);$('fb').textContent='Not that one.';$('fb').className='feedback bad'}});return}
}
function shareText(){const m=T.marks.map(x=>x==='r'?'🟥':'🟧').join('');
  return `The Puzz · Hanko #${T.day} 判\nToday: ${T.c} (${kw(T.c)})\n${m}\nStamp book: ${Object.keys(deck).length} kanji`}
function renderSheet(){const n=T.marks.filter(x=>x==='r').length;$('steps').innerHTML='';
  $('main').innerHTML=`<section class="sheet"><h2>Today's sheet is stamped</h2>${revealHTML(T.c)}<pre id="shareTxt">${esc(shareText())}</pre>
    <div class="row"><button class="btn primary" id="copyBtn">Copy result</button><button class="btn" id="bookBtn">Open stamp book</button><button class="btn" id="moreBtn">Practise more</button></div>
    <div class="sub">${n} of ${T.marks.length} stamped first time. A new kanji arrives at midnight.</div></section>`;
  $('copyBtn').onclick=e=>{const b=e.currentTarget,ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy result',1500)},fb=()=>{const r=document.createRange();r.selectNodeContents($('shareTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected · copy it'};
    try{navigator.clipboard.writeText(shareText()).then(ok,fb)}catch(err){fb()}};
  $('bookBtn').onclick=renderBook;$('moreBtn').onclick=()=>renderPractice()}

// ---- practice ----
let pr=null;
function renderPractice(){setMode('practice');$('sub').textContent='Practice · as many as you like';
  const lim=+$('levelSel').value,pool=ORDER.slice(0,lim),r=mulberry(Date.now()>>>0),c=pool[Math.floor(r()*pool.length)];
  let R;
  if(practiceKind==='build'){const withParts=pool.filter(x=>K[x].p.length>=2);R=buildRound(withParts.length?withParts[Math.floor(r()*withParts.length)]:c,r)}
  else if(practiceKind==='hub'){R=hubAround('p'+Date.now(),pool,new Set(pool))||hubAround('p'+Date.now(),ORDER,new Set(ORDER))}
  else R=recallQ(c,r,r()<.5?'m2k':'k2m');
  renderRound(R,()=>renderPractice())}
document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{practiceKind=b.dataset.pr;document.querySelectorAll('[data-pr]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderPractice()});
$('levelSel').onchange=()=>renderPractice();

// ---- stamp book ----
function renderBook(sel){setMode('book');const met=Object.keys(deck).length,due=dueList().length;
  $('sub').textContent=`${met} of ${ORDER.length} kanji stamped${due?` · ${due} due for review`:''}`;
  $('main').innerHTML=`<section class="card"><div class="legend"><span class="l1">Stamped</span><span class="l2">Due for review</span><span class="l3">Not met yet</span></div>
    <div id="detail" style="width:100%"></div>
    <div class="bookgrid">${ORDER.map(c=>`<button class="bk ${deck[c]?'met':''} ${deck[c]&&deck[c].due<=day?'due':''}" data-b="${c}" aria-label="${c} ${esc(kw(c))}${deck[c]?'':' (not met)'}">${c}</button>`).join('')}</div></section>`;
  const show=c=>{const k=K[c];$('detail').innerHTML=`<div class="detail">${revealHTML(c,`<div class="sub">${deck[c]?`Stamped · review level ${deck[c].box} of 5`:'Not met yet'} · ${k.s} strokes · grade ${k.g}</div>`)}</div>`};
  $('main').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>show(b.dataset.b));if(sel)show(sel)}

// ---- wiring ----
$('tToday').onclick=loadToday;$('tPractice').onclick=()=>renderPractice();$('tBook').onclick=()=>renderBook();
$('readBtn').setAttribute('aria-pressed',showReads);
$('readBtn').onclick=()=>{showReads=!showReads;store.set('hanko-reads',showReads);$('readBtn').setAttribute('aria-pressed',showReads);if(mode==='book')renderBook();else if(mode==='today')renderToday();else renderPractice()};
$('daySel').innerHTML=Array.from({length:60},(_,i)=>`<option value="${i+1}">${i+1} · ${ORDER[i]}</option>`).join('');
$('daySel').value=String(Math.min(60,day));
$('daySel').onchange=()=>{day=+$('daySel').value;store.set('hanko-today',null);loadToday()};
$('resetBtn').onclick=()=>{deck={};saveDeck();store.set('hanko-today',null);day=realDay();$('daySel').value=String(Math.min(60,day));loadToday()};
loadToday();
</script>
